[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sverige-begagnad-mcp"
version = "0.3.0"
description = "MCP server that searches Swedish second-hand marketplaces (Blocket, Tradera, Klaravik, Vinted) for quality used items to flip."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tudor" }]
keywords = ["mcp", "blocket", "tradera", "second-hand", "sweden", "loppis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Internet",
]
dependencies = [
    # mcp 2.0 removed the FastMCP API this server uses; stay on the 1.x line
    # (>=1.9 for the tool title= argument).
    "mcp>=1.9.0,<2.0.0",
    "blocket-api>=0.5.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sverige-begagnad-mcp = "sverige_begagnad_mcp.server:main"

[project.urls]
Homepage = "https://github.com/tudorgrigoriu90/sverige-begagnad-mcp"
Repository = "https://github.com/tudorgrigoriu90/sverige-begagnad-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/sverige_begagnad_mcp"]
